{% for pokemon in pokemons %}

<div>
    <h2>{{ pokemon.name }}</h2>

    <img src="{{ pokemon.sprites.front_default }}" alt="{{ pokemon.name }}">

    <p>
        Tipo:
        {% for tipo in tipos_pokemons[loop.index0] %}
        {{ tipo }}
        {% endfor %}
    </p>

    <a href="{{ url_for('detalle_pokemon', id=pokemon.id) }}">
        Ver detalle
    </a>
</div>

{% endfor %}
